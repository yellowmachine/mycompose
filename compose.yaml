services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: mycompose
      POSTGRES_PASSWORD: mycompose
      POSTGRES_DB: mycompose
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mycompose -d mycompose']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
